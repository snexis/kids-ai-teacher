<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>বাচ্চাদের এআই শিক্ষক</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --bg-color: #f0f8ff;
            --text-color: #333;
            --card-bg: #fff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        @media (max-width: 360px) {
            .container { padding: 1.5rem; }
            h2 { font-size: 1.5rem; }
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover { background-color: #43a047; }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            background-color: #f44336;
            color: white;
            margin-top: 0.5rem;
        }

        #teacher-interface { display: none; }
        
        .chat-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fafafa;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 1rem;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #e3f2fd;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: #e8f5e9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            color: #777;
            padding: 5px;
        }

        .icon-btn.recording { color: red; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #image-preview {
            max-width: 80px;
            max-height: 80px;
            display: none;
            margin-top: 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="login-interface" class="container">
        <h2 id="login-title">🔒 প্রথমবার সেটআপ</h2>
        
        <div class="input-group">
            <label for="reg-id">লগইন আইডি:</label>
            <input type="text" id="reg-id" placeholder="যেমন: kid123">
        </div>
        
        <div class="input-group">
            <label for="reg-pass">পাসওয়ার্ড দিন:</label>
            <input type="password" id="reg-pass" placeholder="****">
        </div>

        <button id="auth-btn" class="btn btn-primary">সেটআপ করো</button>
        <button id="logout-clear-btn" class="btn btn-secondary" style="display: none;">লগআউট ও আইডি মুছুন</button>
        <p id="login-msg" style="color: red; margin-top: 10px;"></p>
    </div>

    <div id="teacher-interface" class="container chat-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0;">🧑‍🏫 এআই শিক্ষক</h2>
            <button id="exit-btn" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;" title="লগআউট">🚪</button>
        </div>
        
        <div id="chat-window">
            <div class="message ai-message">হ্যালো! আমি তোমার এআই শিক্ষক। যেকোনো প্রশ্ন করতে পারো, ছবি দেখাতে পারো বা মুখে বলেও জিজ্ঞেস করতে পারো!</div>
        </div>

        <img id="image-preview" src="#" alt="ছবি প্রিভিউ">

        <div class="input-area">
            <input type="text" id="user-input" placeholder="প্রশ্ন লেখো...">
            <button id="voice-btn" class="icon-btn" title="ভয়েস টাইপ">🎙️</button>
            <label for="image-input" class="icon-btn" title="ছবি তোলো">📷</label>
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button id="send-btn" class="icon-btn" style="color: var(--primary-color);">➡️</button>
        </div>
    </div>

    <script>
        // আপনার Netlify Function-এর সঠিক লিঙ্ক দিন
        const NETLIFY_FUNCTION_URL = "https://classy-smakager-ea0164.netlify.app/.netlify/functions/gemini";

        const loginInterface = document.getElementById('login-interface');
        const teacherInterface = document.getElementById('teacher-interface');
        const loginTitle = document.getElementById('login-title');
        const regIdInput = document.getElementById('reg-id');
        const regPassInput = document.getElementById('reg-pass');
        const authBtn = document.getElementById('auth-btn');
        const logoutClearBtn = document.getElementById('logout-clear-btn');
        const loginMsg = document.getElementById('login-msg');
        const exitBtn = document.getElementById('exit-btn');

        function checkAuthStatus() {
            const storedUser = localStorage.getItem('kids_teacher_user');
            if (storedUser) {
                loginTitle.textContent = "👋 স্বাগতম!";
                authBtn.textContent = "লগইন করো";
                logoutClearBtn.style.display = "block";
            } else {
                loginTitle.textContent = "🔒 প্রথমবার সেটআপ";
                authBtn.textContent = "সেটআপ করো";
                logoutClearBtn.style.display = "none";
            }
        }

        checkAuthStatus();

        authBtn.addEventListener('click', () => {
            const id = regIdInput.value.trim();
            const pass = regPassInput.value.trim();
            const storedUser = localStorage.getItem('kids_teacher_user');

            if (!id || !pass) {
                loginMsg.textContent = "আইডি এবং পাসওয়ার্ড দুটিই দাও।";
                return;
            }

            if (storedUser) {
                const user = JSON.parse(storedUser);
                if (user.id === id && user.pass === pass) {
                    loginInterface.style.display = "none";
                    teacherInterface.style.display = "flex";
                    loginMsg.textContent = "";
                } else {
                    loginMsg.textContent = "ভুল আইডি বা পাসওয়ার্ড!";
                }
            } else {
                const newUser = { id, pass };
                localStorage.setItem('kids_teacher_user', JSON.stringify(newUser));
                loginMsg.style.color = "green";
                loginMsg.textContent = "সেটআপ সফল! এখন লগইন বোতামে ক্লিক করো।";
                regIdInput.value = "";
                regPassInput.value = "";
                checkAuthStatus();
            }
        });

        logoutClearBtn.addEventListener('click', () => {
            localStorage.removeItem('kids_teacher_user');
            regIdInput.value = "";
            regPassInput.value = "";
            loginMsg.style.color = "red";
            loginMsg.textContent = "আইডি ও পাসওয়ার্ড মুছে ফেলা হয়েছে। নতুন সেটআপ করুন।";
            checkAuthStatus();
        });

        exitBtn.addEventListener('click', () => {
            teacherInterface.style.display = "none";
            loginInterface.style.display = "block";
        });

        // Chat & API Integration
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const imageInput = document.getElementById('image-input');
        const imagePreview = document.getElementById('image-preview');

        let selectedImageBase64 = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImageBase64 = event.target.result.split(',')[1];
                imagePreview.src = event.target.result;
                imagePreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';

            voiceBtn.addEventListener('click', () => {
                if (voiceBtn.classList.contains('recording')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                voiceBtn.classList.add('recording');
                voiceBtn.textContent = "🛑";
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = "🎙️";
            };

            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
            };
        } else {
            voiceBtn.style.display = "none";
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt && !selectedImageBase64) return;

            appendMessage('user', prompt, selectedImageBase64 ? imagePreview.src : null);
            userInput.value = '';
            imagePreview.style.display = "none";
            const currentImage = selectedImageBase64;
            selectedImageBase64 = null;

            const loadingMsg = appendMessage('ai', 'ভেবে বলছি...');

            try {
                const response = await fetch(NETLIFY_FUNCTION_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt, image: currentImage })
                });

                const data = await response.json();
                loadingMsg.remove();

                if (!response.ok) {
                    appendMessage('ai', 'সমস্যা: ' + (data.error || 'অজানা এরর'));
                    return;
                }

                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "উত্তর পাওয়া যায়নি।";
                appendMessage('ai', aiText);

            } catch (error) {
                loadingMsg.remove();
                appendMessage('ai', 'নেটওয়ার্ক সমস্যা। আবার চেষ্টা করো।');
            }
        }

        function appendMessage(sender, text, imgSrc = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');

            if (imgSrc) {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.style.maxWidth = "100%";
                img.style.borderRadius = "8px";
                img.style.marginBottom = "5px";
                msgDiv.appendChild(img);
            }

            if (text) {
                const textNode = document.createElement('span');
                textNode.textContent = text;
                msgDiv.appendChild(textNode);
            }

            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
