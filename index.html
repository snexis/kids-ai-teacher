<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাচ্চাদের এআই শিক্ষক</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px;">
        <h2>🎈 এআই শিক্ষক 🎈</h2>
        <p>যেকোনো প্রশ্ন করো, সহজ করে বুঝিয়ে দেব!</p>

        <input type="text" id="userQuestion" placeholder="প্রশ্ন লিখুন..." style="padding: 10px; width: 60%;">
        <button onclick="askAI()" style="padding: 10px 20px; background-color: #e06666; color: white; border: none; cursor: pointer;">উত্তর দাও</button>

        <p id="responseArea" style="margin-top: 20px; font-weight: bold;"></p>
    </div>

    <script>
    async function askAI() {
        const questionInput = document.getElementById("userQuestion").value;
        const responseArea = document.getElementById("responseArea");

        if (!questionInput) {
            alert("অনুগ্রহ করে একটি প্রশ্ন লিখুন!");
            return;
        }

        responseArea.innerText = "উত্তর তৈরি হচ্ছে, একটু অপেক্ষা করুন...";

        // আপনার আসল Gemini API Key-টি নিচের কোটেশনের ভেতরে বসান
        const apiKey = "AIzaSyCg5ttOQHcdqupwlD9lDam6IFfh6P1mdos"; 

        const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: questionInput }]
                    }]
                })
            });

            const data = await response.json();

            if (response.ok) {
                const answer = data.candidates[0].content.parts[0].text;
                responseArea.innerText = answer;
            } else {
                responseArea.innerText = "এরর: " + (data.error?.message || "উত্তর পাওয়া যায়নি");
            }
        } catch (err) {
            responseArea.innerText = "নেটওয়ার্ক কানেকশনে সমস্যা হয়েছে।";
        }
    }
    </script>

</body>
</html>
