<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাচ্চাদের এআই শিক্ষক</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; padding: 20px; text-align: center; }
        .chat-box { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 15px; font-size: 16px; background-color: #ff6f61; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #response { margin-top: 20px; font-size: 17px; color: #333; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="chat-box">
        <h2>🎈 এআই শিক্ষক 🎈</h2>
        <p>যেকোনো প্রশ্ন করো, সহজ করে বুঝিয়ে দেব!</p>
        <input type="text" id="userInput" placeholder="যেমন: চাঁদ রাতে আলো দেয় কেন?">
        <button onclick="askAI()">উত্তর দাও</button>
        <div id="response"></div>
    </div>

    <script>
    async function askAI() {
    const userInput = document.querySelector('input').value;
    const responseDiv = document.querySelector('.result-box') || document.body; // আপনার উত্তর দেখানোর ঘর

    if (!userInput) {
        alert("কিছু একটা লিখুন!");
        return;
    }

    // আপনার গুগল এআই স্টুডিওর আসল API Key-টি এখানে বসান
    const apiKey = "AQ.Ab8RN6KmEuA0WDz-EGjA66-v35dzSxIeuRd4QjEMHxHduf9qRA"; 

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: userInput }]
                }]
            })
        });

        const data = await response.json();

        if (response.ok) {
            // সফলভাবে উত্তর পেলে তা স্ক্রিনে দেখাবে
            const aiText = data.candidates[0].content.parts[0].text;
            document.querySelector('p:last-of-type').innerText = aiText;
        } else {
            // এপিআই-তে কোনো সমস্যা হলে আসল এরর মেসেজ দেখাবে
            console.error("API Error:", data);
            document.querySelector('p:last-of-type').innerText = "এরর: " + (data.error?.message || "কী বা মডেলে সমস্যা");
        }
    } catch (error) {
        console.error("Network Error:", error);
        document.querySelector('p:last-of-type').innerText = "নেটওয়ার্ক বা কোডে সমস্যা হয়েছে।";
    }
}
    </script>

</body>
</html>
